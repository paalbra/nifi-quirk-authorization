services:
  certs-init:
    image: "alpine:latest"
    volumes:
      - "ldap-certs:/certs/ldap"
      - "nifi-certs:/certs/nifi"
      - "./init-certs.sh:/init-certs.sh:ro,z"
    entrypoint: ["sh", "/init-certs.sh"]

  openldap:
    image: "rroemhild/test-openldap:latest"
    depends_on:
      certs-init:
        condition: "service_completed_successfully"
    ports:
      - "10389:10389"
      - "10636:10636"
    volumes:
      - "ldap-certs:/etc/ldap/ssl"
    healthcheck:
      # First success touches a marker. Later exit silently, to prevent bloating log
      test: ["CMD-SHELL", "[ -f /tmp/.healthy ] || { ldapsearch -x -H ldap://localhost:10389 -b dc=planetexpress,dc=com >/dev/null 2>&1 && touch /tmp/.healthy; }"]
      interval: "10s"
      timeout: "10s"
      retries: 10
      start_period: "10s"

  nifi:
    build:
      context: "."
      dockerfile: "Dockerfile.nifi"
    depends_on:
      openldap:
        condition: "service_healthy"
    ports:
      - "8443:8443"
    volumes:
      - "nifi-certs:/opt/certs"
      - "nifi-logs:/opt/nifi/nifi-current/logs"
    environment:
      NIFI_WEB_PROXY_HOST: "nifi:8443"
      AUTH: "ldap"
      KEYSTORE_PATH: "/opt/certs/server.keystore.jks"
      KEYSTORE_TYPE: "JKS"
      KEYSTORE_PASSWORD: "not-secret"
      TRUSTSTORE_PATH: "/opt/certs/truststore.ldap.jks"
      TRUSTSTORE_TYPE: "JKS"
      TRUSTSTORE_PASSWORD: "not-secret"
      INITIAL_ADMIN_IDENTITY: "fry"
      LDAP_AUTHENTICATION_STRATEGY: "SIMPLE"
      LDAP_MANAGER_DN: "cn=admin,dc=planetexpress,dc=com"
      LDAP_MANAGER_PASSWORD: "GoodNewsEveryone"
      LDAP_USER_SEARCH_BASE: "ou=people,dc=planetexpress,dc=com"
      LDAP_USER_SEARCH_FILTER: "uid={0}"
      LDAP_IDENTITY_STRATEGY: "USE_USERNAME"
      LDAP_URL: "ldap://openldap:10389"

  helper:
    image: "alpine:latest"
    depends_on:
      openldap:
        condition: "service_healthy"
    volumes:
      - "ldap-certs:/certs/ldap"
      - "nifi-certs:/certs/nifi"
      - "./alternate-user.sh:/alternate-user.sh:ro,z"
    entrypoint: ["sh", "/alternate-user.sh"]

volumes:
  ldap-certs:
  nifi-certs:
  nifi-logs:
